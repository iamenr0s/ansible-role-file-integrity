---
# audit: read-only. remediate: package, units, timer, and (only with consent) the baseline database.
- name: Run file_integrity
  when: linux_hardening_fi_enabled | bool
  block:
    - name: Gather the os_family fact (play may set gather_facts false)
      ansible.builtin.setup:
        gather_subset: [min]
      when: "'os_family' not in ansible_facts"

    - name: Validate linux_hardening_mode
      ansible.builtin.assert:
        that: linux_hardening_mode in ['audit', 'remediate']
        fail_msg: "linux_hardening_mode must be 'audit' or 'remediate', got '{{ linux_hardening_mode }}'"
        quiet: true

    - name: Skip other OS families
      ansible.builtin.set_fact:
        linux_hardening_fi_findings: []
      when: ansible_facts['os_family'] not in __linux_hardening_fi_family

    - name: Say why the role was skipped
      ansible.builtin.debug:
        msg: "file_integrity supports the RedHat and Debian families; {{ ansible_facts['os_family'] }} is skipped."
      when: ansible_facts['os_family'] not in __linux_hardening_fi_family

    - name: Run on a supported family
      when: ansible_facts['os_family'] in __linux_hardening_fi_family
      block:
        - name: Audit (read-only)
          ansible.builtin.include_tasks: audit.yml
          when: linux_hardening_mode == 'audit'

        - name: Remediate
          when: linux_hardening_mode == 'remediate'
          block:
            - name: Require explicit remediation confirmation
              ansible.builtin.assert:
                that: linux_hardening_confirm_remediation | bool
                fail_msg: >-
                  Remediation installs AIDE and schedules a daily integrity check (and, with
                  linux_hardening_fi_init_database, records the current machine state as the trusted baseline).
                  Set linux_hardening_confirm_remediation: true to proceed
                  (run with linux_hardening_mode: audit to preview).
                quiet: true

            - name: Configure
              ansible.builtin.include_tasks: configure.yml

            # Check mode changes nothing, so a re-audit would only repeat the findings.
            - name: Verify effective configuration
              ansible.builtin.include_tasks: audit.yml
              vars:
                __lh_fi_audit_fatal: true
              when:
                - linux_hardening_verify | bool
                - not ansible_check_mode
