---
# Read-only. Sets the __lh_fi_* facts.
- name: facts | Gather package facts
  ansible.builtin.package_facts:

- name: facts | Work out whether aide is installed
  ansible.builtin.set_fact:
    __lh_fi_installed: "{{ 'aide' in ansible_facts['packages'] }}"

# Same arguments as the write in configure.yml; check mode only reports whether it would change (content, owner, mode).
- name: facts | Compare the units with the templates
  ansible.builtin.template:
    src: "aide-check.{{ item }}.j2"
    dest: "/etc/systemd/system/{{ __lh_fi_unit }}.{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop: [service, timer]
  check_mode: true
  register: __lh_fi_units

- name: facts | Stat the baseline database
  ansible.builtin.stat:
    path: "{{ __lh_fi_paths['db'] }}"
  register: __lh_fi_db

- name: facts | Query the timer
  ansible.builtin.systemd_service:
    name: "{{ __lh_fi_unit }}.timer"
  register: __lh_fi_timer
  failed_when: false

# Can take minutes on a real machine: it reads every file in the configuration. Not async: the state file
# would show up in the scan.
- name: facts | Compare the machine with the baseline
  ansible.builtin.command: "{{ __lh_fi_paths['bin'] }} --config={{ __lh_fi_paths['conf'] }} --check"
  register: __lh_fi_check
  changed_when: false
  failed_when: false
  check_mode: false  # read-only; an audit under --check must still compare
  when:
    - linux_hardening_fi_run_check | bool
    - __lh_fi_installed | bool
    - __lh_fi_db['stat']['exists']
