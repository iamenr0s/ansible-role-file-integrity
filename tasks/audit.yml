---
- name: audit | Gather AIDE state
  ansible.builtin.include_tasks: facts.yml

# One task per check; each appends a finding (key, expected, actual, fixable) when its check fails.
- name: audit | Start with no findings
  ansible.builtin.set_fact:
    __lh_fi_findings: []

- name: audit | Report a missing aide package
  ansible.builtin.set_fact:
    __lh_fi_findings: "{{ __lh_fi_findings + [__lh_fi_finding] }}"
  vars:
    __lh_fi_finding:
      key: package aide
      expected: installed
      actual: missing
      fixable: true
  when: not __lh_fi_installed

- name: audit | Check the installed setup
  when: __lh_fi_installed
  vars:
    __lh_fi_timer_status: "{{ __lh_fi_timer['status'] | default({}) }}"
  block:
    - name: audit | Report a missing baseline database
      ansible.builtin.set_fact:
        __lh_fi_findings: "{{ __lh_fi_findings + [__lh_fi_finding] }}"
      vars:
        __lh_fi_finding:
          key: "baseline database {{ __lh_fi_paths['db'] }}"
          expected: present
          actual: >-
            {{ 'missing' if linux_hardening_fi_init_database | bool
               else 'missing (reported only: it records the current state as trusted,'
                    ~ ' set linux_hardening_fi_init_database)' }}
          fixable: "{{ linux_hardening_fi_init_database | bool }}"
      when: not __lh_fi_db['stat']['exists']

    - name: audit | Report units that differ from the templates
      ansible.builtin.set_fact:
        __lh_fi_findings: "{{ __lh_fi_findings + [__lh_fi_finding] }}"
      vars:
        __lh_fi_finding:
          key: "unit /etc/systemd/system/{{ __lh_fi_unit }}.{{ item['item'] }}"
          expected: present with the desired settings
          actual: missing or different
          fixable: true
        # What configure.yml writes; combining it over the stat changes the stat only if something differs.
        __lh_fi_want:
          exists: true
          checksum: "{{ lookup('ansible.builtin.template', 'aide-check.' ~ item['item'] ~ '.j2') | hash('sha1') }}"
          mode: '0644'
          pw_name: root
          gr_name: root
      loop: "{{ __lh_fi_units['results'] }}"
      loop_control:
        label: "{{ item['item'] }}"
      when: item['stat'] | combine(__lh_fi_want) != item['stat']

    - name: audit | Report a timer that is not enabled
      ansible.builtin.set_fact:
        __lh_fi_findings: "{{ __lh_fi_findings + [__lh_fi_finding] }}"
      vars:
        __lh_fi_finding:
          key: "timer {{ __lh_fi_unit }} enabled"
          expected: enabled
          actual: "{{ __lh_fi_timer_status['UnitFileState'] | default('unknown') }}"
          fixable: true
      when: __lh_fi_timer_status['UnitFileState'] | default('') != 'enabled'

    - name: audit | Report a timer that is not active
      ansible.builtin.set_fact:
        __lh_fi_findings: "{{ __lh_fi_findings + [__lh_fi_finding] }}"
      vars:
        __lh_fi_finding:
          key: "timer {{ __lh_fi_unit }} active"
          expected: active
          actual: "{{ __lh_fi_timer_status['ActiveState'] | default('unknown') }}"
          fixable: true
      when: __lh_fi_timer_status['ActiveState'] | default('') != 'active'

    # aide --check exits 1-7 when files differ (a bitmask of added/removed/changed), higher on errors.
    - name: audit | Report files that differ from the baseline
      ansible.builtin.set_fact:
        __lh_fi_findings: "{{ __lh_fi_findings + [__lh_fi_finding] }}"
      vars:
        __lh_fi_finding:
          key: files match the baseline
          expected: no differences
          actual: >-
            aide --check exit {{ __lh_fi_check['rc'] }}: files differ
            (reported only: review them, then update the baseline yourself)
          fixable: false
      when:
        - __lh_fi_check['rc'] is defined
        - __lh_fi_check['rc'] in range(1, 8)

    - name: audit | Report an aide --check that did not run cleanly
      ansible.builtin.set_fact:
        __lh_fi_findings: "{{ __lh_fi_findings + [__lh_fi_finding] }}"
      vars:
        __lh_fi_finding:
          key: aide --check runs
          expected: exit 0
          actual: "exit {{ __lh_fi_check['rc'] }} (reported only)"
          fixable: false
      when:
        - __lh_fi_check['rc'] is defined
        - __lh_fi_check['rc'] not in range(0, 8)

- name: audit | Record findings
  ansible.builtin.set_fact:
    linux_hardening_fi_findings: "{{ __lh_fi_findings }}"

- name: audit | Report file_integrity result
  ansible.builtin.debug:
    msg: "{{ 'COMPLIANT' if linux_hardening_fi_findings | length == 0 else linux_hardening_fi_findings }}"

- name: audit | Fail on findings
  ansible.builtin.fail:
    msg: "file_integrity found {{ linux_hardening_fi_findings | length }} deviation(s)."
  when:
    - not __lh_fi_audit_fatal | default(false)
    - linux_hardening_fail_on_error | bool
    - linux_hardening_fi_findings | length > 0

# After remediation only fixable findings fail the run; the baseline and file differences need a human.
- name: audit | Fail on findings remediation should have fixed
  ansible.builtin.fail:
    msg: "file_integrity left {{ __lh_fi_unfixed | length }} fixable deviation(s)."
  vars:
    __lh_fi_unfixed: "{{ linux_hardening_fi_findings | selectattr('fixable') | list }}"
  when:
    - __lh_fi_audit_fatal | default(false)
    - __lh_fi_unfixed | length > 0
