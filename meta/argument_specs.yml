---
argument_specs:
  main:
    short_description: Audit and set up AIDE file integrity monitoring with a scheduled check.
    options:
      linux_hardening_mode: {type: str, default: audit, choices: [audit, remediate], description: "audit is read-only."}
      linux_hardening_confirm_remediation: {type: bool, default: false, description: "Must be true before remediate changes anything."}
      linux_hardening_backup: {type: bool, default: true, description: "Back up the units when they change."}
      linux_hardening_verify: {type: bool, default: true, description: "Re-audit after remediation."}
      linux_hardening_fail_on_error: {type: bool, default: true, description: "Fail the play when audit finds deviations."}
      linux_hardening_fi_enabled: {type: bool, default: true, description: "Run the role."}
      linux_hardening_fi_init_database: {type: bool, default: false, description: "Allow building the baseline database from the current state of the machine."}
      linux_hardening_fi_schedule: {type: str, default: daily, description: "systemd OnCalendar expression for the scheduled check."}
      linux_hardening_fi_run_check: {type: bool, default: false, description: "Audit also runs aide --check and reports differences from the baseline."}
